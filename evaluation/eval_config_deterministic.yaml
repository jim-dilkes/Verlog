# Deterministic Evaluation Configuration
# This configuration uses deterministic generation for reproducible results

# Model and Generation Parameters
model:
  generation:
    temperature: 0.0          # Deterministic generation
    top_k: -1                 # Disable top-k sampling
    top_p: 1.0                # Disable top-p sampling
    do_sample: false          # Greedy decoding
    max_response_length: 256  # Maximum response length
    max_prompt_length: 1500   # Maximum prompt length
  
  loading:
    trust_remote_code: false
    use_fast_tokenizer: true
    torch_dtype: "auto"

# Evaluation-specific Settings
evaluation:
  disable_training_features: true
  val_before_train: false
  test_freq: -1
  save_freq: -1
  total_epochs: 1
  log_val_generations: 1
  logger: ["console", "wandb"]

# Paths and Directories
paths:
  default_output_dir: "/scratch/jsbd1n24/evaluation_results"
  default_wandb_project: "AAMAS_msrl_base"
  base_config_path: "Verlog/verl/trainer/config/ppo_trainer.yaml"
